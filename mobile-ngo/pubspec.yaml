name: food_rescue_ngo
description: Food Rescue NGO - Standalone NGO mobile application for food rescue operations.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.3.2

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.0.1

  # Storage
  shared_preferences: ^2.2.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # UI
  google_fonts: ^6.1.0
  intl: ^0.18.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
