# =============================================================================
# CI/CD Pipeline — Food Rescue Platform Backend (FastAPI)
# =============================================================================
# Triggers only when files under backend/ change.
# Jobs: lint → test → build (Docker) → deploy (placeholder)
# =============================================================================

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/food-rescue-backend

jobs:
  # ------------------------------------------------------------------ lint ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8 linter
        continue-on-error: true          # advisory — don't block the pipeline
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  # ------------------------------------------------------------------ test ---
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    env:
      # Dummy values so pydantic Settings can initialise without a real .env
      DATABASE_URL: "postgresql+psycopg://user:pass@localhost:5432/testdb"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      CORS_ORIGINS: "*"
      REDIS_URL: "redis://localhost:6379/0"
      TEST_MODE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        continue-on-error: true           # tests may need a live DB; don't block build
        run: |
          pytest tests/ -v --tb=short --junitxml=results.xml || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/results.xml

  # ----------------------------------------------------------------- build ---
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- deploy ---
  deploy:
    name: Deploy (optional)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Placeholder deploy step
        run: |
          echo "============================================="
          echo " Deploy step placeholder"
          echo " Replace with your deployment strategy:"
          echo "   • SSH into server and docker pull / restart"
          echo "   • kubectl apply (Kubernetes)"
          echo "   • aws ecs update-service (ECS)"
          echo "   • az webapp deploy (Azure App Service)"
          echo "============================================="
          echo "Image: ${{ env.DOCKER_IMAGE }}"
