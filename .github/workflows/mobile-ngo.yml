# =============================================================================
# CI/CD Pipeline — Food Rescue NGO Mobile App (Flutter)
# =============================================================================
# Triggers only when files under mobile-ngo/ change.
# Jobs: analyze → test → build (release APK)
# =============================================================================

name: Mobile NGO CI/CD

on:
  push:
    branches: [main]
    paths:
      - "mobile-ngo/**"
      - ".github/workflows/mobile-ngo.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-ngo/**"
      - ".github/workflows/mobile-ngo.yml"

jobs:
  # --------------------------------------------------------------- analyze ---
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-ngo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ------------------------------------------------------------------ test ---
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: mobile-ngo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngo-coverage
          path: mobile-ngo/coverage/

  # ----------------------------------------------------------------- build ---
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: mobile-ngo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngo-release-apk
          path: mobile-ngo/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
